<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>七彩虹吸管吹畫 - 麥克風高相容修復版</title>
<style>
/* ==========================================================================
   1. 共同基礎樣式 (電腦與平板通用)
   ========================================================================== */
body {
  margin: 0; padding: 0;
  width: 100vw; height: 100vh;
  overflow: hidden;
  background-color: #f5f5f5;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  user-select: none;
  -webkit-user-select: none;
}

/* 🎨 上方：畫布區（精確佔用 85% 高度） */
canvas {
  display: block;
  width: 100vw;
  height: 85vh;
  background: #fff;
  box-sizing: border-box;
  cursor: crosshair;
}

/* 🌈 下方：七彩調色盤與控制區（精確佔用 15% 高度） */
#palette {
  position: fixed; bottom: 0; left: 0;
  width: 100vw;
  height: 15vh;
  z-index: 10;
  background: rgba(255, 255, 255, 0.96);
  padding: 10px 20px;
  box-sizing: border-box;
  box-shadow: 0 -4px 16px rgba(0,0,0,0.12);
  display: flex;
  align-items: center;
}

#palette h1 { font-size: 13px; margin: 0 0 4px; color: #555; white-space: nowrap; }
.section-block { display: flex; flex-direction: column; justify-content: center; }

#swatches { display: flex; gap: 6px; }
.swatch {
  position: relative; width: 36px; height: 36px; border-radius: 50%;
  border: 3px solid #fff; cursor: pointer; padding: 0;
  box-shadow: 0 2px 6px rgba(0,0,0,.2);
  transition: transform .12s ease, box-shadow .12s ease;
  flex-shrink: 0;
}
.swatch::before {
  content: ""; position: absolute; left: 8px; top: 10px; width: 4px; height: 4px;
  background: #333; border-radius: 50%; box-shadow: 10px 0 0 #333;
}
.swatch::after {
  content: ""; position: absolute; left: 9px; top: 16px; width: 8px; height: 4px;
  border: 2px solid #333; border-top: none; border-radius: 0 0 8px 8px;
}
.swatch.dark::before { background: #fff; box-shadow: 10px 0 0 #fff; }
.swatch.dark::after { border-color: #fff; }
.swatch:active { transform: scale(.92); }
.swatch.active { transform: scale(1.15); box-shadow: 0 0 0 2px #444, 0 4px 8px rgba(0,0,0,.25); }

.actions { display: flex; gap: 6px; }
.btn {
  border: none; border-radius: 10px; padding: 6px 12px; font-weight: bold; font-size: 13px;
  cursor: pointer; background: #fff; color: #444; box-shadow: 0 2px 5px rgba(0,0,0,.15);
  white-space: nowrap;
}
.btn:active { transform: scale(.96); }
.btn.active { background: #4a90e2; color: #fff; }

#angle-box { min-width: 160px; }
.angle-row { display: flex; align-items: center; gap: 6px; }
.angle-row input { flex: 1; touch-action: none; }
.angle-ends { display: flex; justify-content: space-between; font-size: 10px; color: #888; }

.instruction-section { color: #666; line-height: 1.4; }
.instruction-section ol { margin: 0; padding-left: 18px; }

/* ==========================================================================
   2. 📱 平板電腦偏窄螢幕適配 (螢幕寬度 1024px 以下)
   ========================================================================== */
@media (max-width: 1024px) {
  #palette {
    flex-wrap: wrap;
    align-content: space-around;
    gap: 8px 20px;
    overflow-x: auto;
    overflow-y: hidden;
    padding: 8px 15px;
  }
  .swatch { width: 40px; height: 40px; }
  .btn { padding: 8px 12px; font-size: 13px; }
  .instruction-section { min-width: 320px; font-size: 11px; }
}

/* ==========================================================================
   3. 💻 電腦寬螢幕適配 (螢幕寬度 1025px 以上)
   ========================================================================== */
@media (min-width: 1025px) {
  #palette {
    flex-wrap: nowrap;
    justify-content: space-between;
    gap: 25px;
  }
  .instruction-section { max-width: 450px; font-size: 12px; }
}
</style>
</head>
<body>

  <canvas id="paintCanvas"></canvas>

  <div id="palette">
    <!-- 1. 七彩調色盤 -->
    <div class="section-block">
      <h1>🌈 七彩調色盤</h1>
      <div id="swatches">
        <div class="swatch active" style="background: #ff5e5e;" data-color="#ff5e5e"></div>
        <div class="swatch" style="background: #ff9f43;" data-color="#ff9f43"></div>
        <div class="swatch" style="background: #feca57;" data-color="#feca57"></div>
        <div class="swatch" style="background: #1dd1a1;" data-color="#1dd1a1"></div>
        <div class="swatch" style="background: #54a0ff;" data-color="#54a0ff"></div>
        <div class="swatch dark" style="background: #5f27cd;" data-color="#5f27cd"></div>
        <div class="swatch dark" style="background: #222f3e;" data-color="#222f3e"></div>
      </div>
    </div>

    <!-- 2. 畫布背景選擇 -->
    <div class="section-block">
      <h1>🖼 畫布背景選擇</h1>
      <div class="actions">
        <button class="btn active" id="bg-blank">⬜ 空白畫布</button>
        <button class="btn" id="bg-hedgehog">🦔 小刺蝟</button>
        <button class="btn" id="bg-avatar">👤 百變髮型</button>
      </div>
    </div>

    <!-- 3. 吸管角度調整 -->
    <div class="section-block" id="angle-box">
      <h1>📐 吸管角度調整: <span id="angle-val">45°</span></h1>
      <div class="angle-row">
        <button class="btn" id="angle-low">🌊 低角度</button>
        <input type="range" id="angle-slider" min="15" max="75" value="45">
        <button class="btn" id="angle-high">🌿 高角度</button>
      </div>
      <div class="angle-ends">
        <span>15° (大面積粗墨)</span>
        <span>75° (細緻樹枝)</span>
      </div>
    </div>

    <!-- 4. 麥克風與系統功能 -->
    <div class="section-block">
      <h1>🎤 吹力偵測: <span id="volume-val">0</span></h1>
      <div class="actions">
        <button class="btn" id="btn-mic">▶ 開啟麥克風</button>
        <button class="btn" id="btn-clear" style="background: #ff6b6b; color: #fff;">🔄 清除重來</button>
        <button class="btn" id="btn-save" style="background: #10ac84; color: #fff;">💾 儲存作品</button>
      </div>
    </div>

    <!-- 5. 操作說明 -->
    <div class="section-block instruction-section">
      <h1>💡 吹畫指南</h1>
      <ol>
        <li>點選顏色</li>
        <li>點擊或觸控畫布滴下墨水水滴（按著不放會變大）</li>
        <li>滑鼠移動或手指拖曳可調整吹畫噴射方向（畫面上顯示箭頭）</li>
        <li>對麥克風吹氣（或關閉麥克風時放開滑鼠），墨水就會順著方向衝出去！</li>
      </ol>
    </div>
  </div>

<script>
const canvas = document.getElementById('paintCanvas');
const ctx = canvas.getContext('2d');

let currentColor = '#ff5e5e';
let currentBG = 'blank';
let blowAngle = 45; 
let isPressing = false;
let startX = 0, startY = 0;
let currentX = 0, currentY = 0;
let dropletRadius = 5;
let pressTimer = null;
let inkParticles = []; 

// 麥克風相關（升級相容版變數）
let audioContext = null;
let analyser = null;
let microphone = null;
let micEnabled = false;

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight * 0.85;
  drawBackground();
}
window.addEventListener('resize', resizeCanvas);
window.addEventListener('DOMContentLoaded', resizeCanvas);

function drawBackground() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  
  if (currentBG === 'hedgehog') {
    ctx.fillStyle = '#eccc68';
    ctx.beginPath();
    ctx.arc(canvas.width / 2, canvas.height / 2 + 50, 80, 0, Math.PI, true);
    ctx.fill();
    ctx.fillStyle = '#ff7f50';
    ctx.beginPath();
    ctx.moveTo(canvas.width / 2 - 80, canvas.height / 2 + 50);
    ctx.lineTo(canvas.width / 2 - 130, canvas.height / 2 + 50);
    ctx.lineTo(canvas.width / 2 - 80, canvas.height / 2 + 20);
    ctx.fill();
  } else if (currentBG === 'avatar') {
    ctx.fillStyle = '#ffdbac';
    ctx.beginPath();
    ctx.arc(canvas.width / 2, canvas.height / 2 + 80, 70, 0, Math.PI * 2);
    ctx.fill();
  }
  
  inkParticles.forEach(p => {
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
  });
}

function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  return { x: clientX - rect.left, y: clientY - rect.top };
}

function handleStart(e) {
  if (e.target.tagName === 'CANVAS') {
    const pos = getPos(e);
    isPressing = true;
    startX = currentX = pos.x;
    startY = currentY = pos.y;
    dropletRadius = 8;
    
    if (pressTimer) clearInterval(pressTimer);
    pressTimer = setInterval(() => {
      if (dropletRadius < 25) dropletRadius += 0.5;
      renderInteraction();
    }, 30);
  }
}

function handleMove(e) {
  if (!isPressing) return;
  const pos = getPos(e);
  currentX = pos.x;
  currentY = pos.y;
  renderInteraction();
}

function handleEnd() {
  if (!isPressing) return;
  isPressing = false;
  clearInterval(pressTimer);
  
  inkParticles.push({ x: startX, y: startY, r: dropletRadius, color: currentColor });
  
  if (!micEnabled) {
    simulateBlow(50); 
  }
  drawBackground();
}

function renderInteraction() {
  drawBackground();
  if (!isPressing) return;
  
  ctx.fillStyle = currentColor;
  ctx.beginPath();
  ctx.arc(startX, startY, dropletRadius, 0, Math.PI * 2);
  ctx.fill();
  
  ctx.strokeStyle = '#4a90e2';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(startX, startY);
  ctx.lineTo(currentX, currentY);
  ctx.stroke();
}

function simulateBlow(force) {
  if (startX === currentX && startY === currentY) return;
  const angle = Math.atan2(currentY - startY, currentX - startX);
  const angleRad = (blowAngle * Math.PI) / 180;
  const lengthMultiplier = Math.cos(angleRad) * (force * 3);
  const branchCount = Math.floor(dropletRadius * (15 / blowAngle)) + 5; 

  for (let i = 0; i < branchCount; i++) {
    let segmentX = startX;
    let segmentY = startY;
    let segmentR = (Math.random() * (dropletRadius / 3)) + 1;
    const branchLength = (Math.random() * lengthMultiplier) + 20;
    
    for (let j = 0; j < branchLength; j++) {
      const jitter = (Math.random() - 0.5) * (1.2 - (blowAngle / 90));
      segmentX += Math.cos(angle + jitter) * 2;
      segmentY += Math.sin(angle + jitter) * 2;
      segmentR *= 0.96;
      
      if (segmentR < 0.3) break;
