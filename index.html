<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>班級看板</title>
<style>
:root {
  --scale: 1;
  --c-topbar: #e08a6d; --c-bg: #cddff0; --c-card: #e6f0f9; --c-primary: #c8553d;
  --c-text: #3b3b3b; --c-muted: #6b6b6b; --c-highlight: #f1e2b6; --c-accent: #d4a017;
  --c-good: #2e7d4f; --c-alert: #d62828; --c-remark: #efdbe6; --c-tips: #d7e6dc;
}
* { box-sizing: border-box; }
html { font-size: calc(min(1vw, 1.8vh) * var(--scale)); }
html, body { margin: 0; height: 100%; }
body {
  background: var(--c-bg); color: var(--c-text);
  font-family: "Microsoft JhengHei", "微軟正黑體", "PingFang TC", "Noto Sans TC", sans-serif;
  display: flex; flex-direction: column; overflow: hidden;
}
button, input, textarea, select { font: inherit; color: inherit; }

/* ---------- 看板 ---------- */
.topbar {
  background: var(--c-topbar); min-height: 4.2rem; padding: 0.6rem 1.5rem;
  display: flex; align-items: center; justify-content: space-between; gap: 1rem;
}
.topbar h1 { margin: 0; font-size: 2.2rem; color: #fff; font-weight: 700; letter-spacing: 0.1em; }
.btn-fullscreen {
  border: 2px solid rgba(255,255,255,.6); background: rgba(255,255,255,.2); color: #fff;
  border-radius: 999px; padding: 0.4rem 1.4rem; font-size: 1.4rem; cursor: pointer;
}
.board {
  flex: 1; min-height: 0; display: grid; grid-template-columns: 52fr 48fr; gap: 1.2rem; padding: 1.2rem;
}
.left { display: grid; grid-template-rows: auto 1fr; gap: 1.2rem; min-height: 0; }
.card {
  background: var(--c-card); border-radius: 1.2rem; padding: 1.1rem 1.8rem;
  box-shadow: 0 0.2rem 0.8rem rgba(0,0,0,.08); min-height: 0;
}
.clock-card { text-align: center; padding-top: 0.8rem; padding-bottom: 0.9rem; }
.date { font-size: 2.1rem; color: var(--c-muted); }
.time {
  font-size: 8rem; line-height: 1.05; font-weight: 700; color: var(--c-primary);
  font-variant-numeric: tabular-nums; letter-spacing: 0.02em;
}
.countdown { display: flex; align-items: center; justify-content: center; gap: 1rem; margin-top: 0.3rem; font-size: 2.1rem; }
.countdown-time {
  font-size: 3rem; font-weight: 700; color: var(--c-primary); background: rgba(0,0,0,.05);
  border-radius: 0.8rem; padding: 0.1rem 1rem; font-variant-numeric: tabular-nums;
}
.countdown.alert .countdown-time { color: #fff; background: var(--c-alert); animation: blink 1s ease-in-out infinite; }
@keyframes blink { 50% { opacity: 0.55; } }
.status {
  display: inline-block; margin-top: 0.5rem; padding: 0.2rem 2rem; font-size: 2rem;
  border: 2px dashed var(--c-accent); border-radius: 999px; color: var(--c-muted);
}
.class-card { display: flex; flex-direction: column; gap: 0.8rem; overflow: hidden; }
.class-head {
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: space-between; gap: 1rem;
  border-bottom: 2px dashed rgba(0,0,0,.15); padding-bottom: 0.8rem;
}
.class-name { font-size: 4rem; font-weight: 700; color: var(--c-primary); }
.stats { display: flex; gap: 2rem; text-align: center; }
.stat-label { font-size: 1.5rem; color: var(--c-muted); }
.stat-value { font-size: 3.4rem; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat-actual .stat-value { color: var(--c-good); }
.stat-absent .stat-value { color: var(--c-alert); }
.remark { background: var(--c-remark); border-radius: 1rem; padding: 0.6rem 1.4rem; font-size: 1.7rem; flex-shrink: 0; max-height: 40%; overflow-y: auto; }
.remark-title { color: var(--c-muted); margin-bottom: 0.3rem; }
.remark-line { margin: 0.1rem 0; }
.tips {
  background: var(--c-tips); border-radius: 1rem; padding: 0.6rem 1.4rem; font-size: 1.9rem;
  flex: 1; min-height: 0; overflow-y: auto;
}
.tips-title { color: var(--c-muted); margin-bottom: 0.3rem; }
.tips ol { margin: 0; padding-left: 2.4rem; }
.tips li { margin: 0.2rem 0; }
.schedule-card { display: flex; flex-direction: column; }
.schedule-title { font-size: 2.8rem; font-weight: 700; margin-bottom: 0.6rem; }
.schedule-head {
  display: grid; grid-template-columns: 1fr auto; padding: 0 1.4rem; font-size: 1.6rem; color: var(--c-muted);
}
.schedule-list { flex: 1; overflow-y: auto; position: relative; }
.row {
  display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 1rem;
  padding: 1rem 1.4rem; border-bottom: 1px dashed rgba(0,0,0,.12); border-left: 0.5rem solid transparent;
}
.row-time { font-family: Consolas, "Courier New", monospace; font-size: 2.6rem; font-weight: 700; }
.row-subject { font-size: 3.6rem; font-weight: 700; color: var(--c-primary); }
.row.active { background: var(--c-highlight); border-left-color: var(--c-accent); }
.row.active .row-time { color: var(--c-accent); }
.row.next { background: rgba(241,226,182,.4); }
.row.next { background: color-mix(in srgb, var(--c-highlight) 40%, transparent); }
.empty { font-size: 2.6rem; color: var(--c-muted); text-align: center; padding: 3rem 0; }

/* ---------- 設定面板 ---------- */
.handle {
  position: fixed; left: 0; top: 50%; transform: translateY(-50%); z-index: 20;
  width: 26px; height: 120px; border: 0; border-radius: 0 12px 12px 0;
  background: rgba(0,0,0,.25); color: #fff; font-size: 20px; cursor: pointer;
}
.drawer {
  position: fixed; inset: 0 auto 0 0; width: min(620px, 94vw); z-index: 30;
  background: #fff; color: #222; font-size: 15px; box-shadow: 4px 0 24px rgba(0,0,0,.3);
  transform: translateX(-105%); transition: transform .25s; display: flex; flex-direction: column;
}
.drawer.open { transform: none; }
.drawer-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid #ddd; }
.drawer-head h2 { margin: 0; font-size: 18px; }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px 16px; border-bottom: 1px solid #ddd; }
.tab { border: 1px solid #ccc; background: #f5f5f5; border-radius: 6px; padding: 4px 10px; cursor: pointer; }
.tab.on { background: #333; color: #fff; border-color: #333; }
.panel { flex: 1; overflow-y: auto; padding: 16px; }
.panel h3 { font-size: 16px; margin: 18px 0 8px; }
.panel h3:first-child { margin-top: 0; }
.panel label { display: block; margin: 8px 0 4px; font-weight: 600; }
.panel input[type=text], .panel input[type=number], .panel input[type=date], .panel input[type=password], .panel textarea, .panel select {
  width: 100%; padding: 6px 8px; border: 1px solid #bbb; border-radius: 6px; background: #fff;
}
.panel textarea { min-height: 140px; resize: vertical; }
.panel table { width: 100%; border-collapse: collapse; }
.panel td, .panel th { padding: 3px; text-align: left; }
.panel td input { width: 100%; padding: 4px; border: 1px solid #bbb; border-radius: 4px; }
.panel .narrow { width: 4.5em; }
.hint { color: #777; font-size: 13px; margin: 4px 0; }
.btn { border: 1px solid #999; background: #f5f5f5; border-radius: 6px; padding: 5px 12px; cursor: pointer; margin: 4px 4px 4px 0; }
.btn.primary { background: #333; color: #fff; border-color: #333; }
.btn.danger { color: #b00; border-color: #b00; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
.chip { border: 1px solid #999; border-radius: 999px; padding: 4px 12px; cursor: pointer; background: #fff; }
.chip.absent { background: #fde2e2; border-color: #d62828; color: #b00; }
.chip.pulled { background: #fff3cd; border-color: #d4a017; color: #8a6500; }
.color-grid { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: center; }
.color-grid input[type=color] { width: 56px; height: 30px; border: 1px solid #bbb; padding: 0; }
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 40; display: flex; align-items: center; justify-content: center; }
.modal { background: #fff; color: #222; padding: 20px 24px; border-radius: 12px; width: min(320px, 90vw); font-size: 16px; }
.modal input { width: 100%; font-size: 24px; letter-spacing: .4em; text-align: center; padding: 6px; margin: 10px 0; }
.err { color: #b00; min-height: 1.2em; }
</style>
</head>
<body>
<header class="topbar">
  <h1 id="title"></h1>
  <button class="btn-fullscreen" id="btnFullscreen"></button>
</header>
<main class="board">
  <section class="left">
    <div class="card clock-card">
      <div class="date" id="date"></div>
      <div class="time" id="time"></div>
      <div class="countdown" id="countdown">
        <span id="countdownLabel"></span><span class="countdown-time" id="countdownTime"></span>
      </div>
      <div class="status" id="status"></div>
    </div>
    <div class="card class-card">
      <div class="class-head">
        <div class="class-name" id="className"></div>
        <div class="stats">
          <div><div class="stat-label" id="lblExpected"></div><div class="stat-value" id="numExpected"></div></div>
          <div class="stat-actual"><div class="stat-label" id="lblActual"></div><div class="stat-value" id="numActual"></div></div>
          <div class="stat-absent"><div class="stat-label" id="lblAbsent"></div><div class="stat-value" id="numAbsent"></div></div>
          <div><div class="stat-label" id="lblPulled"></div><div class="stat-value" id="numPulled"></div></div>
        </div>
      </div>
      <div class="remark" id="remark"></div>
      <div class="tips" id="tips"></div>
    </div>
  </section>
  <section class="card schedule-card">
    <div class="schedule-title" id="scheduleTitle"></div>
    <div class="schedule-head" id="scheduleHead"><span id="lblTime"></span><span id="lblSubject"></span></div>
    <div class="schedule-list" id="scheduleList"></div>
  </section>
</main>

<button class="handle" id="handle" title="設定">›</button>
<aside class="drawer" id="drawer">
  <div class="drawer-head"><h2>看板設定</h2><button class="btn" id="btnClose">關閉 ✕</button></div>
  <nav class="tabs" id="tabs"></nav>
  <div class="panel" id="panel"></div>
</aside>

<script id="board-logic">
// 看板核心邏輯：純函式，不碰 DOM、不讀 localStorage、不自己取時間。
var BoardLogic = (function () {
  var THEME_PRESETS = {
    warm: { name: '暖橘', colors: {
      topbar: '#e08a6d', bg: '#cddff0', card: '#e6f0f9', primary: '#c8553d',
      text: '#3b3b3b', muted: '#6b6b6b', highlight: '#f1e2b6', accent: '#d4a017',
      good: '#2e7d4f', alert: '#d62828', remark: '#efdbe6', tips: '#d7e6dc' } },
    blue: { name: '清爽藍', colors: {
      topbar: '#4a90c2', bg: '#e8f1f8', card: '#ffffff', primary: '#1f5f8b',
      text: '#22313f', muted: '#5f7385', highlight: '#d5ebfa', accent: '#2a9df4',
      good: '#2e7d4f', alert: '#d62828', remark: '#eef2f7', tips: '#e6f4ea' } },
    dark: { name: '深色', colors: {
      topbar: '#2c3440', bg: '#14181e', card: '#1f262f', primary: '#ffb36b',
      text: '#e8e8e8', muted: '#9aa4ae', highlight: '#3a3320', accent: '#ffcf5c',
      good: '#6fd49a', alert: '#ff6b6b', remark: '#2b2430', tips: '#1f2e26' } },
  };

  function defaultSettings() {
    return {
      version: 1,
      title: '',
      className: '9年04班',
      examDays: {},
      bellSchedule: [
        { start: '07:40', end: '08:10' }, { start: '08:15', end: '09:00' },
        { start: '09:10', end: '09:55' }, { start: '10:05', end: '10:50' },
        { start: '11:00', end: '11:45' }, { start: '12:30', end: '13:10', emoji: '😴' },
        { start: '13:20', end: '14:05' }, { start: '14:15', end: '15:00' },
        { start: '15:15', end: '16:00' },
      ],
      weekly: {
        1: ['早自習', '', '', '', '', '午休', '', '', ''],
        2: ['早自習', '', '', '', '', '午休', '', '', ''],
        3: ['早自習', '', '', '', '', '午休', '', '', ''],
        4: ['早自習', '', '', '', '', '午休', '', '', ''],
        5: ['早自習', '', '', '', '', '午休', '', '', ''],
      },
      roster: '',
      attendance: { date: '', marks: {} },
      tips: '鐘響前請收妥書本\n記得寫上班級、姓名、座號\n考試結束請立即停筆',
      alertMinutes: 5,
      defaultEmoji: '✏️',
      fontScale: 1,
      pin: '',
      theme: { preset: 'warm', colors: Object.assign({}, THEME_PRESETS.warm.colors) },
      labels: {
        scheduleTime: '時間',
        scheduleSubject: '科目',
        status: '目前狀態',
        expected: '應到',
        actual: '實到',
        absent: '未到',
        pulled: '抽離',
        remarkTitle: '備註 (缺席與抽離名單)',
        absentStudents: '未到學生',
        pulledStudents: '抽離學生',
        allPresent: '全員到齊',
        tipsTitle: '導師小叮嚀',
        fullscreen: '全螢幕',
        exitFullscreen: '退出全螢幕',
        countdownEnd: '【{subject}】結束倒數',
        countdownNext: '距離下一節【{subject}】開始',
        break: '下課',
        notStarted: '尚未開始',
        examEnded: '今日考程結束',
        dailyEnded: '今日課程結束',
        examTitle: '今日考程表',
        dailyTitle: '今日課表',
        noneTitle: '今日無課程',
      },
    };
  }

  function pad2(n) { return String(n).padStart(2, '0'); }

  function dateKey(d) {
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  }

  function toMinutes(hhmm) {
    var p = String(hhmm).split(':');
    return Number(p[0]) * 60 + Number(p[1]);
  }

  function formatDuration(totalSeconds) {
    var h = Math.floor(totalSeconds / 3600);
    var m = Math.floor((totalSeconds % 3600) / 60);
    var s = totalSeconds % 60;
    return h > 0 ? h + ':' + pad2(m) + ':' + pad2(s) : pad2(m) + ':' + pad2(s);
  }

  function fill(template, subject) {
    return String(template).replace(/\{subject\}/g, subject);
  }

  function computeBoardState(settings, now) {
    var labels = settings.labels;
    var schedule = resolveSchedule(settings, now);
    var rows = schedule.rows.slice().sort(function (a, b) {
      return toMinutes(a.start) - toMinutes(b.start);
    });
    var midnight = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    var msOfDay = now - midnight;
    var state = {
      mode: schedule.mode,
      title: labels[schedule.mode + 'Title'],
      rows: rows, activeIndex: -1, nextIndex: -1, phase: 'none', countdown: null,
      attendance: summarizeAttendance(settings),
      tips: splitLines(settings.tips),
    };
    if (schedule.mode === 'none') {
      state.statusText = labels.noneTitle;
      return state;
    }

    function countdownTo(targetMs, template, subject) {
      var seconds = Math.floor((targetMs - msOfDay) / 1000);
      return {
        seconds: seconds,
        text: formatDuration(seconds),
        label: fill(template, subject),
        alert: seconds <= settings.alertMinutes * 60,
      };
    }

    for (var i = 0; i < rows.length; i++) {
      var startMs = toMinutes(rows[i].start) * 60000;
      var endMs = toMinutes(rows[i].end) * 60000;
      if (msOfDay >= startMs && msOfDay < endMs) {
        state.phase = 'in-period';
        state.activeIndex = i;
        state.statusText = rows[i].subject;
        state.statusEmoji = rows[i].emoji || settings.defaultEmoji;
        state.countdown = countdownTo(endMs, labels.countdownEnd, rows[i].subject);
        return state;
      }
      if (msOfDay < startMs) {
        state.phase = i === 0 ? 'before' : 'break';
        state.nextIndex = i;
        state.statusText = i === 0 ? labels.notStarted : labels.break;
        state.countdown = countdownTo(startMs, labels.countdownNext, rows[i].subject);
        return state;
      }
    }
    state.phase = 'after';
    state.statusText = schedule.mode === 'exam' ? labels.examEnded : labels.dailyEnded;
    return state;
  }

  function splitLines(text) {
    return String(text || '').split(/\r?\n/).map(function (s) { return s.trim(); }).filter(Boolean);
  }

  // 一行一位；行首的數字視為座號（「7」「7號」都顯示成「7號」）。
  // 沒有座號時看板只顯示「姓XX」保護隱私；同姓會撞名，所以出缺席改用整行當 key。
  function parseRoster(text) {
    return splitLines(text).map(function (line) {
      var m = line.match(/^(\d+)\s*號?/);
      if (m) return { line: line, key: m[1] + '號', seat: m[1] + '號' };
      return { line: line, key: line, seat: Array.from(line)[0] + 'XX' };
    });
  }

  function summarizeAttendance(settings) {
    var marks = settings.attendance.marks;
    var students = parseRoster(settings.roster);
    var absentSeats = [], pulledSeats = [];
    students.forEach(function (st) {
      if (marks[st.key] === 'absent') absentSeats.push(st.seat);
      if (marks[st.key] === 'pulled') pulledSeats.push(st.seat);
    });
    return {
      expected: students.length,
      absent: absentSeats.length,
      pulled: pulledSeats.length,
      actual: students.length - absentSeats.length - pulledSeats.length,
      absentSeats: absentSeats,
      pulledSeats: pulledSeats,
    };
  }

  // 日期與出缺席記錄日期不同時，回傳全部重設為「到」的新設定；同一天回傳 null。
  function applyDailyReset(settings, now) {
    var today = dateKey(now);
    if (settings.attendance.date === today) return null;
    var next = JSON.parse(JSON.stringify(settings));
    next.attendance = { date: today, marks: {} };
    return next;
  }

  var TIME_RE = /^([01]\d|2[0-3]):[0-5]\d$/;
  var DATE_RE = /^\d{4}-\d{2}-\d{2}$/;

  function isPlainObject(v) { return v !== null && typeof v === 'object' && !Array.isArray(v); }

  function allStrings(v, mustBeArray) {
    if (mustBeArray && !Array.isArray(v)) return false;
    return Object.keys(v).every(function (k) { return typeof v[k] === 'string'; });
  }

  function checkRows(rows, where, needSubject, checkOrder) {
    if (!Array.isArray(rows)) return where + ' 必須是清單';
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i];
      if (!isPlainObject(r)) return where + ' 第 ' + (i + 1) + ' 列格式錯誤';
      if (!TIME_RE.test(r.start) || !TIME_RE.test(r.end)) return where + ' 第 ' + (i + 1) + ' 列時間必須是 HH:MM';
      if (checkOrder && toMinutes(r.end) <= toMinutes(r.start)) return where + ' 第 ' + (i + 1) + ' 列結束時間必須晚於開始時間';
      if (needSubject && typeof r.subject !== 'string') return where + ' 第 ' + (i + 1) + ' 列缺少科目';
    }
    return null;
  }

  // 驗證並以預設值補齊設定物件（匯入與讀取 localStorage 共用）。
  // checkOrder 只在匯入時開啟：編輯途中暫時「結束早於開始」的資料仍要能讀回，不能整份作廢。
  function normalizeSettings(raw, checkOrder) {
    if (!isPlainObject(raw)) return { ok: false, error: '設定檔內容必須是物件' };
    if (typeof raw.version !== 'number') return { ok: false, error: '設定檔缺少 version 欄位' };
    var d = defaultSettings();
    var err;
    ['title', 'className', 'roster', 'tips', 'defaultEmoji', 'pin'].forEach(function (k) {
      if (k in raw && typeof raw[k] !== 'string') err = err || (k + ' 必須是文字');
    });
    ['alertMinutes', 'fontScale'].forEach(function (k) {
      if (k in raw && typeof raw[k] !== 'number') err = err || (k + ' 必須是數字');
    });
    if ('pin' in raw && !/^(\d{4})?$/.test(raw.pin)) err = err || 'PIN 碼必須是 4 位數字或留空';
    if (isPlainObject(raw.weekly)) Object.keys(raw.weekly).forEach(function (day) {
      if (!allStrings(raw.weekly[day], true)) err = err || ('週課表（' + day + '）必須是科目文字清單');
    });
    if (isPlainObject(raw.labels) && !allStrings(raw.labels)) err = err || '介面文字必須都是文字';
    if (isPlainObject(raw.theme) && 'colors' in raw.theme &&
        !(isPlainObject(raw.theme.colors) && allStrings(raw.theme.colors))) err = err || '顏色設定格式錯誤';
    if ('examDays' in raw) {
      if (!isPlainObject(raw.examDays)) err = err || 'examDays 格式錯誤';
      else Object.keys(raw.examDays).forEach(function (date) {
        if (!DATE_RE.test(date)) err = err || ('考程表日期「' + date + '」必須是 YYYY-MM-DD');
        else err = err || checkRows(raw.examDays[date], '考程表 ' + date, true, checkOrder);
      });
    }
    if ('bellSchedule' in raw) err = err || checkRows(raw.bellSchedule, '節次時間表', false, checkOrder);
    if ('weekly' in raw && !isPlainObject(raw.weekly)) err = err || 'weekly 格式錯誤';
    ['labels', 'theme', 'attendance'].forEach(function (k) {
      if (k in raw && !isPlainObject(raw[k])) err = err || (k + ' 格式錯誤');
    });
    if (err) return { ok: false, error: err };

    var s = Object.assign(d, JSON.parse(JSON.stringify(raw)));
    s.labels = Object.assign(defaultSettings().labels, raw.labels);
    var theme = raw.theme || {};
    s.theme = {
      preset: theme.preset || d.theme.preset,
      colors: Object.assign({}, defaultSettings().theme.colors, theme.colors),
    };
    s.weekly = Object.assign(defaultSettings().weekly, raw.weekly);
    s.attendance = {
      date: (raw.attendance && raw.attendance.date) || '',
      marks: (raw.attendance && isPlainObject(raw.attendance.marks)) ? raw.attendance.marks : {},
    };
    Object.keys(s.examDays).forEach(function (date) {
      s.examDays[date] = s.examDays[date].map(function (r) {
        return { start: r.start, end: r.end, subject: r.subject, emoji: r.emoji || '' };
      });
    });
    return { ok: true, settings: s };
  }

  function importSettings(text) {
    var raw;
    try { raw = JSON.parse(text); } catch (e) { return { ok: false, error: '不是有效的設定檔（JSON 格式錯誤）' }; }
    return normalizeSettings(raw, true);
  }

  // 指定日期考程表優先；否則週一～週五依週課表（共用節次時間，空白科目略過）。
  function resolveSchedule(settings, now) {
    var exam = settings.examDays[dateKey(now)];
    if (exam && exam.length) return { mode: 'exam', rows: exam };
    var subjects = settings.weekly[now.getDay()] || [];
    var rows = [];
    settings.bellSchedule.forEach(function (bell, i) {
      var subject = (subjects[i] || '').trim();
      if (subject) rows.push({ start: bell.start, end: bell.end, subject: subject, emoji: bell.emoji || '' });
    });
    if (rows.length) return { mode: 'daily', rows: rows };
    return { mode: 'none', rows: [] };
  }

  return {
    defaultSettings: defaultSettings,
    computeBoardState: computeBoardState,
    parseRoster: parseRoster,
    applyDailyReset: applyDailyReset,
    normalizeSettings: normalizeSettings,
    importSettings: importSettings,
    dateKey: dateKey,
    THEME_PRESETS: THEME_PRESETS,
  };
})();
</script>

<script>
// 看板畫面與設定面板：讀寫 localStorage、每秒依 computeBoardState 的結果渲染。
(function () {
  var L = BoardLogic;
  var STORAGE_KEY = 'classBoard.settings.v1';
  var WEEKDAYS = ['日', '一', '二', '三', '四', '五', '六'];
  var PHASE_EMOJI = { before: '⏳', break: '🔔', after: '✅', none: '🏠' };
  var MARK_CYCLE = { undefined: 'absent', absent: 'pulled', pulled: undefined };
  var DEMO_EXAM = [
    ['08:15', '08:45', '自習', '☕'], ['08:45', '09:55', '社會', ''], ['10:05', '10:25', '自習', '☕'],
    ['10:25', '11:45', '數學', ''], ['12:45', '13:20', '午休', '😴'], ['13:20', '13:50', '自習', '☕'],
    ['13:50', '15:00', '國文', ''], ['15:10', '16:00', '作文', ''],
  ].map(function (r) { return { start: r[0], end: r[1], subject: r[2], emoji: r[3] }; });

  var LABEL_NAMES = [
    ['examTitle', '課表標題（考試日）'], ['dailyTitle', '課表標題（平常日）'], ['noneTitle', '無課程時的文字'],
    ['scheduleTime', '課表欄位：時間'], ['scheduleSubject', '課表欄位：科目'],
    ['countdownEnd', '上課中倒數'], ['countdownNext', '空檔倒數'],
    ['status', '目前狀態'], ['break', '下課時的狀態'], ['notStarted', '第一節前的狀態'],
    ['examEnded', '考試日最後一節後'], ['dailyEnded', '平常日最後一節後'],
    ['expected', '應到'], ['actual', '實到'], ['absent', '未到'], ['pulled', '抽離'],
    ['remarkTitle', '備註標題'], ['absentStudents', '未到學生'], ['pulledStudents', '抽離學生'], ['allPresent', '全員到齊'],
    ['tipsTitle', '導師小叮嚀標題'], ['fullscreen', '全螢幕按鈕'], ['exitFullscreen', '退出全螢幕按鈕'],
  ];
  var COLOR_NAMES = [
    ['topbar', '頂部橫條'], ['bg', '背景'], ['card', '卡片底色'], ['primary', '主色（時鐘、班名、科目）'],
    ['text', '文字'], ['muted', '次要文字'], ['highlight', '目前節次高亮'], ['accent', '高亮邊條／狀態框'],
    ['good', '實到數字'], ['alert', '倒數提醒／未到數字'], ['remark', '備註區底色'], ['tips', '小叮嚀底色'],
  ];

  // 新的一節接在上一節後面，預設 45 分鐘
  function nextPeriod(rows) {
    var last = rows[rows.length - 1];
    var start = last ? last.end : '08:00';
    var m = Math.min(Number(start.slice(0, 2)) * 60 + Number(start.slice(3)) + 45, 23 * 60 + 59);
    return { start: start, end: String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'), emoji: '' };
  }

  var settings = load();
  var currentTab = 'exam';
  var editingDate = L.dateKey(new Date());
  var lastScheduleSig = '';
  var lastActive = null;

  function $(id) { return document.getElementById(id); }
  function el(tag, attrs, children) {
    var e = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      if (k === 'text') e.textContent = attrs[k];
      else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), attrs[k]);
      else if (k === 'class') e.className = attrs[k];
      else e.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (c) { if (c) e.appendChild(c); });
    return e;
  }

  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var r = L.normalizeSettings(JSON.parse(raw));
        if (r.ok) return r.settings;
      }
    } catch (e) { /* 無法讀取時使用預設值 */ }
    return L.defaultSettings();
  }

  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(settings)); } catch (e) { /* 無法保存時仍可顯示 */ }
  }

  function commit() { save(); applyAppearance(); lastScheduleSig = ''; render(); }

  // ---------- 看板渲染 ----------
  function applyAppearance() {
    var root = document.documentElement.style;
    Object.keys(settings.theme.colors).forEach(function (k) { root.setProperty('--c-' + k, settings.theme.colors[k]); });
    root.setProperty('--scale', settings.fontScale);
  }

  function render() {
    var now = new Date();
    var reset = L.applyDailyReset(settings, now);
    // 只換掉出缺席，設定面板裡的編輯器仍指向同一個 settings 物件
    if (reset) { settings.attendance = reset.attendance; save(); }
    var st = L.computeBoardState(settings, now);
    var lb = settings.labels;

    $('title').textContent = settings.title;
    $('btnFullscreen').textContent = '⛶ ' + (document.fullscreenElement ? lb.exitFullscreen : lb.fullscreen);
    $('date').textContent = now.getFullYear() + '年' + (now.getMonth() + 1) + '月' + now.getDate() + '日 星期' + WEEKDAYS[now.getDay()];
    $('time').textContent = [now.getHours(), now.getMinutes(), now.getSeconds()]
      .map(function (n) { return String(n).padStart(2, '0'); }).join(':');

    var cd = $('countdown');
    cd.style.visibility = st.countdown ? 'visible' : 'hidden';
    if (st.countdown) {
      $('countdownLabel').textContent = st.countdown.label;
      $('countdownTime').textContent = st.countdown.text;
      cd.classList.toggle('alert', st.countdown.alert);
    }
    var emoji = st.phase === 'in-period' ? st.statusEmoji : PHASE_EMOJI[st.phase];
    $('status').textContent = emoji + ' ' + lb.status + '：' + st.statusText;

    $('className').textContent = settings.className;
    $('lblExpected').textContent = lb.expected; $('numExpected').textContent = st.attendance.expected;
    $('lblActual').textContent = lb.actual; $('numActual').textContent = st.attendance.actual;
    $('lblAbsent').textContent = lb.absent; $('numAbsent').textContent = st.attendance.absent;
    $('lblPulled').textContent = lb.pulled; $('numPulled').textContent = st.attendance.pulled;
    renderRemark(st.attendance, lb);
    renderTips(st.tips, lb);
    renderSchedule(st, lb);
  }

  function renderRemark(a, lb) {
    var box = $('remark');
    box.replaceChildren(el('div', { class: 'remark-title', text: '📝 ' + lb.remarkTitle }));
    if (a.absentSeats.length) box.appendChild(el('div', { class: 'remark-line', text: '❌ ' + lb.absentStudents + '：' + a.absentSeats.join('、') }));
    if (a.pulledSeats.length) box.appendChild(el('div', { class: 'remark-line', text: '↗️ ' + lb.pulledStudents + '：' + a.pulledSeats.join('、') }));
    if (a.expected && !a.absentSeats.length && !a.pulledSeats.length) box.appendChild(el('div', { class: 'remark-line', text: '✅ ' + lb.allPresent }));
  }

  function renderTips(tips, lb) {
    var sig = JSON.stringify([tips, lb.tipsTitle]);
    var box = $('tips');
    if (box.dataset.sig === sig) return; // 避免每秒重建而打斷捲動
    box.dataset.sig = sig;
    box.replaceChildren(
      el('div', { class: 'tips-title', text: '💌 ' + lb.tipsTitle }),
      el('ol', {}, tips.map(function (t) { return el('li', { text: t }); }))
    );
  }

  function renderSchedule(st, lb) {
    $('scheduleTitle').textContent = '🌻 ' + st.title;
    $('lblTime').textContent = lb.scheduleTime;
    $('lblSubject').textContent = lb.scheduleSubject;
    $('scheduleHead').style.display = st.rows.length ? '' : 'none';
    var sig = JSON.stringify([st.rows, st.activeIndex, st.nextIndex, st.title]);
    if (sig === lastScheduleSig) return;
    lastScheduleSig = sig;
    var list = $('scheduleList');
    if (!st.rows.length) {
      list.replaceChildren(el('div', { class: 'empty', text: lb.noneTitle }));
      return;
    }
    list.replaceChildren.apply(list, st.rows.map(function (r, i) {
      var cls = 'row' + (i === st.activeIndex ? ' active' : '') + (i === st.nextIndex ? ' next' : '');
      return el('div', { class: cls }, [
        el('div', { class: 'row-time', text: r.start + ' - ' + r.end }),
        el('div', { class: 'row-subject', text: r.subject }),
      ]);
    }));
    var focus = st.activeIndex >= 0 ? st.activeIndex : st.nextIndex;
    if (focus !== lastActive) {
      lastActive = focus;
      var target = list.children[Math.max(focus, 0)];
      if (target) list.scrollTop = target.offsetTop;
    }
  }

  // ---------- 全螢幕 ----------
  $('btnFullscreen').addEventListener('click', function () {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(function () {});
  });
  document.addEventListener('fullscreenchange', realign);

  // 字型載入或視窗大小改變後列高會變，重新把目前這一節捲到頂端
  function realign() { lastScheduleSig = ''; lastActive = null; render(); }
  window.addEventListener('resize', realign);
  if (document.fonts) document.fonts.ready.then(realign);

  // ---------- 設定面板 ----------
  var TABS = [
    ['exam', '考程表'], ['daily', '日課表'], ['roster', '名單'], ['text', '小叮嚀／標題'],
    ['labels', '介面文字'], ['look', '外觀'], ['backup', '備份與安全'],
  ];

  $('handle').addEventListener('click', function () {
    if (settings.pin) askPin(openDrawer); else openDrawer();
  });
  $('btnClose').addEventListener('click', function () { $('drawer').classList.remove('open'); });

  function openDrawer() { $('drawer').classList.add('open'); renderPanel(); }

  function askPin(onOk) {
    var input = el('input', { type: 'password', inputmode: 'numeric', maxlength: '4' });
    var err = el('div', { class: 'err' });
    var bg = el('div', { class: 'modal-bg' }, [el('div', { class: 'modal' }, [
      el('div', { text: '請輸入 PIN 碼' }), input, err,
      el('button', { class: 'btn primary', text: '確定', onclick: check }),
      el('button', { class: 'btn', text: '取消', onclick: function () { bg.remove(); } }),
    ])]);
    function check() {
      if (input.value === settings.pin) { bg.remove(); onOk(); }
      else { err.textContent = 'PIN 碼錯誤'; input.value = ''; input.focus(); }
    }
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter') check(); });
    document.body.appendChild(bg);
    input.focus();
  }

  function renderPanel() {
    $('tabs').replaceChildren.apply($('tabs'), TABS.map(function (t) {
      return el('button', { class: 'tab' + (t[0] === currentTab ? ' on' : ''), text: t[1],
        onclick: function () { currentTab = t[0]; renderPanel(); } });
    }));
    var panel = $('panel');
    panel.replaceChildren();
    PANELS[currentTab](panel);
  }

  function textInput(value, onInput, attrs) {
    return el('input', Object.assign({ type: 'text', value: value == null ? '' : value,
      oninput: function (e) { onInput(e.target.value); commit(); } }, attrs || {}));
  }
  function timeInput(value, onChange) {
    return el('input', { type: 'time', value: value, onchange: function (e) {
      if (e.target.value) { onChange(e.target.value); commit(); }
    } });
  }
  function textArea(value, onInput) {
    var t = el('textarea', { oninput: function (e) { onInput(e.target.value); commit(); } });
    t.value = value;
    return t;
  }
  function button(text, onClick, cls) { return el('button', { class: 'btn ' + (cls || ''), text: text, onclick: onClick }); }

  // 時間、科目、emoji 的列編輯器，考程表與節次時間表共用。
  function rowsEditor(rows, withSubject, onChange) {
    var table = el('table');
    if (rows.some(function (r) { return r.end <= r.start; })) {
      table.appendChild(el('caption', { class: 'err', text: '紅色列的結束時間沒有晚於開始時間，這一節不會被標示。' }));
    }
    table.appendChild(el('tr', {}, [
      el('th', { text: '開始' }), el('th', { text: '結束' }),
      withSubject ? el('th', { text: '科目' }) : null, el('th', { text: 'emoji' }), el('th'),
    ]));
    rows.forEach(function (r, i) {
      var bad = r.end <= r.start; // HH:MM 字串可直接比較
      table.appendChild(el('tr', bad ? { style: 'background:#fde2e2', title: '結束時間必須晚於開始時間' } : {}, [
        el('td', {}, [timeInput(r.start, function (v) { r.start = v; })]),
        el('td', {}, [timeInput(r.end, function (v) { r.end = v; })]),
        withSubject ? el('td', {}, [textInput(r.subject, function (v) { r.subject = v; })]) : null,
        el('td', {}, [textInput(r.emoji, function (v) { r.emoji = v; }, { class: 'narrow' })]),
        el('td', {}, [button('刪除', function () { rows.splice(i, 1); onChange(i); }, 'danger')]),
      ]));
    });
    return table;
  }

  var PANELS = {
    exam: function (p) {
      var dates = Object.keys(settings.examDays).sort();
      p.appendChild(el('h3', { text: '指定日期考程表' }));
      p.appendChild(el('p', { class: 'hint', text: '有建立考程表的日期會優先顯示考程表；沒有的日期依「日課表」顯示。補課日也可以在這裡建立。' }));
      var dateInput = el('input', { type: 'date', value: editingDate, onchange: function (e) {
        if (e.target.value) { editingDate = e.target.value; renderPanel(); }
      } });
      p.appendChild(el('label', { text: '編輯日期' }));
      p.appendChild(dateInput);
      if (dates.length) {
        p.appendChild(el('p', { class: 'hint', text: '已建立：' }));
        p.appendChild(el('div', { class: 'chips' }, dates.map(function (d) {
          return el('span', { class: 'chip' + (d === editingDate ? ' pulled' : ''), text: d,
            onclick: function () { editingDate = d; renderPanel(); } });
        })));
      }
      var rows = settings.examDays[editingDate];
      if (!rows) {
        p.appendChild(button('建立空白考程表', function () {
          settings.examDays[editingDate] = [{ start: '08:00', end: '08:45', subject: '', emoji: '' }]; commit(); renderPanel();
        }, 'primary'));
        p.appendChild(button('用範例考程建立', function () {
          settings.examDays[editingDate] = JSON.parse(JSON.stringify(DEMO_EXAM)); commit(); renderPanel();
        }));
        return;
      }
      p.appendChild(rowsEditor(rows, true, function () { commit(); renderPanel(); }));
      p.appendChild(button('＋ 新增一節', function () {
        rows.push(Object.assign(nextPeriod(rows), { subject: '' })); commit(); renderPanel();
      }));
      p.appendChild(el('h3', { text: '複製或刪除' }));
      var copyTo = el('input', { type: 'date' });
      p.appendChild(el('label', { text: '把這天的考程表複製到' }));
      p.appendChild(copyTo);
      p.appendChild(button('複製', function () {
        if (!copyTo.value) return alert('請先選擇目標日期');
        if (settings.examDays[copyTo.value] && !confirm(copyTo.value + ' 已有考程表，要覆蓋嗎？')) return;
        settings.examDays[copyTo.value] = JSON.parse(JSON.stringify(rows));
        editingDate = copyTo.value; commit(); renderPanel();
      }));
      p.appendChild(button('刪除這天的考程表', function () {
        if (!confirm('確定刪除 ' + editingDate + ' 的考程表？')) return;
        delete settings.examDays[editingDate]; commit(); renderPanel();
      }, 'danger'));
    },

    daily: function (p) {
      var bells = settings.bellSchedule;
      p.appendChild(el('h3', { text: '節次時間表（每天共用）' }));
      p.appendChild(el('p', { class: 'hint', text: '早自習、午休也可以當成一節。emoji 會顯示在「目前狀態」前面。' }));
      p.appendChild(rowsEditor(bells, false, function (removed) {
        // 週課表與節次以索引對應，刪掉一節時各天的科目一起往前移
        [1, 2, 3, 4, 5].forEach(function (d) { settings.weekly[d].splice(removed, 1); });
        commit(); renderPanel();
      }));
      p.appendChild(button('＋ 新增一節', function () { bells.push(nextPeriod(bells)); commit(); renderPanel(); }));
      p.appendChild(el('h3', { text: '週課表' }));
      p.appendChild(el('p', { class: 'hint', text: '科目留空的節次不會顯示在看板上。' }));
      var table = el('table');
      table.appendChild(el('tr', {}, [el('th', { text: '時間' })].concat([1, 2, 3, 4, 5].map(function (d) {
        return el('th', { text: '週' + WEEKDAYS[d] });
      }))));
      bells.forEach(function (b, i) {
        table.appendChild(el('tr', {}, [el('td', { text: b.start })].concat([1, 2, 3, 4, 5].map(function (d) {
          return el('td', {}, [textInput(settings.weekly[d][i] || '', function (v) { settings.weekly[d][i] = v; })]);
        }))));
      });
      p.appendChild(table);
    },

    roster: function (p) {
      p.appendChild(el('label', { text: '班級名稱' }));
      p.appendChild(textInput(settings.className, function (v) { settings.className = v; }));
      p.appendChild(el('label', { text: '全班名單（一行一位）' }));
      p.appendChild(el('p', { class: 'hint', text: '行首寫座號，例如「7號 王小明」或「7」。看板只顯示座號；沒有座號的行只顯示姓氏加 XX（例如「王XX」）。' }));
      var chips = el('div', { class: 'chips' });
      p.appendChild(textArea(settings.roster, function (v) { settings.roster = v; drawChips(); }));
      p.appendChild(el('h3', { text: '今日出缺席（點一下切換：到 → 未到 → 抽離）' }));
      p.appendChild(chips);
      p.appendChild(button('全部重設為「到」', function () { settings.attendance.marks = {}; commit(); drawChips(); }));
      function drawChips() {
        var marks = settings.attendance.marks;
        chips.replaceChildren.apply(chips, L.parseRoster(settings.roster).map(function (s) {
          var m = marks[s.key];
          var tag = m === 'absent' ? '（' + settings.labels.absent + '）' : m === 'pulled' ? '（' + settings.labels.pulled + '）' : '';
          return el('span', { class: 'chip ' + (m || ''), text: s.line + tag, onclick: function () {
            var nextMark = MARK_CYCLE[m];
            if (nextMark) marks[s.key] = nextMark; else delete marks[s.key];
            commit(); drawChips();
          } });
        }));
      }
      drawChips();
    },

    text: function (p) {
      p.appendChild(el('label', { text: '頂部標題（留空則不顯示）' }));
      p.appendChild(textInput(settings.title, function (v) { settings.title = v; }));
      p.appendChild(el('label', { text: '導師小叮嚀（一行一條，自動編號）' }));
      p.appendChild(textArea(settings.tips, function (v) { settings.tips = v; }));
    },

    labels: function (p) {
      p.appendChild(el('p', { class: 'hint', text: '時間、數字、科目名稱由程式自動帶入，這裡只改固定文字。' }));
      LABEL_NAMES.forEach(function (n) {
        p.appendChild(el('label', { text: n[1] }));
        p.appendChild(textInput(settings.labels[n[0]], function (v) { settings.labels[n[0]] = v; }));
        if (/\{subject\}/.test(L.defaultSettings().labels[n[0]])) {
          p.appendChild(el('p', { class: 'hint err', text: '⚠️ 請不要更改或刪除文字中的 {subject}，它會自動換成' +
            (n[0] === 'countdownNext' ? '下一節的' : '目前的') + '科目名稱。其他文字可以自由修改。' }));
        }
      });
    },

    look: function (p) {
      p.appendChild(el('h3', { text: '預設配色' }));
      Object.keys(L.THEME_PRESETS).forEach(function (k) {
        p.appendChild(button(L.THEME_PRESETS[k].name, function () {
          settings.theme = { preset: k, colors: Object.assign({}, L.THEME_PRESETS[k].colors) }; commit(); renderPanel();
        }, settings.theme.preset === k ? 'primary' : ''));
      });
      p.appendChild(el('h3', { text: '逐項調整顏色' }));
      var grid = el('div', { class: 'color-grid' });
      COLOR_NAMES.forEach(function (n) {
        grid.appendChild(el('span', { text: n[1] }));
        grid.appendChild(el('input', { type: 'color', value: settings.theme.colors[n[0]], oninput: function (e) {
          settings.theme.colors[n[0]] = e.target.value; settings.theme.preset = ''; commit();
        } }));
      });
      p.appendChild(grid);
      p.appendChild(el('h3', { text: '字級與提醒' }));
      var scaleText = el('span', { text: Math.round(settings.fontScale * 100) + '%' });
      p.appendChild(el('label', {}, [document.createTextNode('整體字級縮放 '), scaleText]));
      p.appendChild(el('input', { type: 'range', min: '0.8', max: '1.5', step: '0.05', value: settings.fontScale, style: 'width:100%',
        oninput: function (e) { settings.fontScale = Number(e.target.value); scaleText.textContent = Math.round(settings.fontScale * 100) + '%'; commit(); } }));
      p.appendChild(el('label', { text: '倒數剩下幾分鐘開始提醒（變色閃爍，不出聲）' }));
      p.appendChild(el('input', { type: 'number', min: '0', max: '60', value: settings.alertMinutes, oninput: function (e) {
        var v = Number(e.target.value); if (e.target.value !== '' && v >= 0) { settings.alertMinutes = v; commit(); }
      } }));
      p.appendChild(el('label', { text: '節次沒填 emoji 時的預設圖示' }));
      p.appendChild(textInput(settings.defaultEmoji, function (v) { settings.defaultEmoji = v; }, { class: 'narrow' }));
    },

    backup: function (p) {
      p.appendChild(el('h3', { text: '匯出／匯入設定檔' }));
      p.appendChild(el('p', { class: 'hint', text: '設定存在這台電腦的瀏覽器裡。換電腦、換瀏覽器或搬動這個 html 檔前，請先匯出備份。' }));
      p.appendChild(button('匯出設定檔', function () {
        var blob = new Blob([JSON.stringify(settings, null, 2)], { type: 'application/json' });
        var a = el('a', { href: URL.createObjectURL(blob), download: '班級看板設定-' + L.dateKey(new Date()) + '.json' });
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
      }, 'primary'));
      var msg = el('div', { class: 'err' });
      var file = el('input', { type: 'file', accept: '.json,application/json', onchange: function (e) {
        var f = e.target.files[0];
        if (!f) return;
        f.text().then(function (text) {
          var r = L.importSettings(text);
          if (!r.ok) { msg.textContent = '匯入失敗：' + r.error + '（原本的設定沒有變動）'; return; }
          settings = r.settings; commit(); renderPanel();
          alert('匯入成功');
        });
      } });
      p.appendChild(el('label', { text: '匯入設定檔' }));
      p.appendChild(file);
      p.appendChild(msg);

      p.appendChild(el('h3', { text: 'PIN 碼（防學生誤觸）' }));
      p.appendChild(el('p', { class: 'hint', text: settings.pin ? '目前已啟用 PIN 碼。' : '目前未啟用。啟用後，開啟設定面板前需要輸入 4 位數 PIN 碼。這只能防止誤觸，不是安全保護。' }));
      var pinInput = el('input', { type: 'password', inputmode: 'numeric', maxlength: '4', placeholder: '4 位數字' });
      var pinMsg = el('div', { class: 'err' });
      p.appendChild(pinInput);
      p.appendChild(button(settings.pin ? '更改 PIN 碼' : '啟用 PIN 碼', function () {
        if (!/^\d{4}$/.test(pinInput.value)) { pinMsg.textContent = 'PIN 碼必須是 4 位數字'; return; }
        settings.pin = pinInput.value; commit(); renderPanel();
      }, 'primary'));
      if (settings.pin) p.appendChild(button('停用 PIN 碼', function () { settings.pin = ''; commit(); renderPanel(); }, 'danger'));
      p.appendChild(pinMsg);

      p.appendChild(el('h3', { text: '還原' }));
      p.appendChild(button('全部還原為預設值', function () {
        if (!confirm('所有設定（考程、課表、名單、文字、顏色）都會清除，確定嗎？建議先匯出備份。')) return;
        settings = L.defaultSettings(); commit(); renderPanel();
      }, 'danger'));
    },
  };

  applyAppearance();
  render();
  setInterval(render, 1000);
})();
</script>
</body>
</html>
